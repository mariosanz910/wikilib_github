<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del Sistema</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
        }
        .card {
            width: 400px;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .title { margin-bottom: 20px; color: #d32f2f; }
        .message { margin-bottom: 30px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="card">
    <h1 class="title">Se ha producido un error</h1>
    <p class="message">Lo sentimos, ha ocurrido un error inesperado al procesar tu solicitud. Por favor, intenta iniciar sesión de nuevo.</p>
    
    <a th:href="@{/login}" class="btn">Volver al Login</a>
</div>

</body>
</html>
