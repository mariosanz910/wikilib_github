<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Colección - Panel de Redactor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea.form-control { resize: vertical; min-height: 100px; }
    </style>
</head>

<body>
    <div class="container" style="max-width: 600px; margin: 40px auto;">
        <div class="header">
            <h1>Editar Colección</h1>
            <a href="/redactor/mis-series" class="btn btn-secondary">Cancelar</a>
        </div>

        <form th:action="@{/redactor/editar-serie/{id}(id=${serie.id})}" method="post">
            <div class="form-group">
                <label for="nombre">Nombre de la Colección <span style="color: red;">*</span></label>
                <input type="text" id="nombre" name="nombre" class="form-control" th:value="${serie.nombre}" required maxlength="100">
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción (Opcional)</label>
                <textarea id="descripcion" name="descripcion" class="form-control" maxlength="500" th:text="${serie.descripcion}"></textarea>
            </div>

            <button type="submit" class="btn" style="width: 100%;">Guardar Cambios</button>
        </form>
    </div>
</body>
</html>
