<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Redactor - WikiLib</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 14px;
            text-align: left;
            vertical-align: middle;
        }

        /* CABECERA */
        th {
            background-color: #111;
            color: white;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f8f8f8;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* BOTONES SUPERIORES */
        .top-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* BOTONES ACCIONES TABLA */
        .action-buttons {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .action-buttons form {
            margin: 0;
        }

        /* BOTONES */
        .btn {
            background-color: #111;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s ease;
            font-size: 14px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 85px;
            height: 36px;

            white-space: nowrap;
            box-sizing: border-box;
        }

        .btn:hover {
            background-color: #333;
        }

        /* BOTÓN ELIMINAR */
        .btn-danger {
            background-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        /* ALERTA */
        .alert {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background-color: #f4f4f4;
        }

        /* LINKS TÍTULOS */
        td a:not(.btn) {
            text-decoration: none;
            color: #111;
            font-weight: 500;
        }

        td a:not(.btn):hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Panel del Redactor</h1>

        <div class="top-buttons">
            <a href="/catalogo" class="btn">Ver catálogo</a>
            <a href="/logout" class="btn btn-danger">Cerrar sesión</a>
        </div>

    </div>

    <p>
        Bienvenido,
        <strong sec:authentication="name">Redactor</strong>
    </p>

    <div style="margin-top: 30px;">

        <div class="header">

            <h2>Tus Publicaciones</h2>

            <div class="top-buttons">

                <a href="/redactor/mis-series" class="btn">
                    Mis Colecciones
                </a>

                <a href="/redactor/nueva-publicacion" class="btn">
                    + Crear publicación
                </a>

            </div>

        </div>

        <div th:if="${publicaciones.isEmpty()}">
            <p class="alert">
                No tienes publicaciones aún. ¡Anímate a escribir!
            </p>
        </div>

        <table th:unless="${publicaciones.isEmpty()}">

            <thead>
            <tr>
                <th>Título</th>
                <th>Categoría</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="pub : ${publicaciones}">

                <td>
                    <a th:href="@{/publicacion/{id}(id=${pub.id})}"
                       th:text="${pub.titulo}">
                        Título
                    </a>
                </td>

                <td th:text="${pub.categoria != null ? pub.categoria.nombre : '-'}">
                    -
                </td>

                <td th:text="${#temporals.format(pub.fechaCreacion, 'dd/MM/yyyy')}">
                    Fecha
                </td>

                <td>

                    <div class="action-buttons">

                        <a th:href="@{/redactor/editar-publicacion/{id}(id=${pub.id})}"
                           class="btn">
                            Editar
                        </a>

                        <form th:action="@{/redactor/eliminar-publicacion/{id}(id=${pub.id})}"
                              method="post"
                              onsubmit="return confirm('¿Seguro que quieres eliminar esta publicación?')">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>

                            <button type="submit"
                                    class="btn btn-danger">
                                Eliminar
                            </button>

                        </form>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<div th:insert="fragments/footer :: footer"></div>

</body>
</html>
