<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Publicación - WikiLib</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="'https://cdn.tiny.cloud/1/' + ${@environment.getProperty('tinymce.api.key')} + '/tinymce/6/tinymce.min.js'"></script>

</head>
<body>

<div class="container">
    <div class="header">
        <h1>Editar Publicación</h1>
        <a href="/redactor/panel" class="btn">Volver al panel</a>
    </div>

    <form th:action="@{/redactor/editar-publicacion/{id}(id=${publicacion.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div th:if="${param.error}" style="background-color: #ffebee; color: #c62828; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ef9a9a;">
            <strong>Error:</strong> Los campos no pueden estar vacíos ni contener solo espacios.
        </div>

        <div>
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" name="titulo" th:value="${publicacion.titulo}" required maxlength="200" pattern=".*\S+.*" title="El título no puede estar vacío o contener solo espacios">
        </div>

        <div>
            <label for="categoriaId">Categoría:</label>
            <select id="categoriaId" name="categoriaId">
                <option value="">(Sin categoría)</option>
                <option th:each="cat : ${categorias}"
                        th:value="${cat.id}"
                        th:text="${cat.nombre}"
                        th:selected="${publicacion.categoria != null and publicacion.categoria.id == cat.id}">Categoría</option>
            </select>
        </div>

        <div style="display: flex; gap: 20px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label for="serieId">Colección (Opcional):</label>
                <select id="serieId" name="serieId" style="width: 100%; padding: 8px;">
                    <option value="">(Sin colección)</option>
                    <option th:each="serie : ${series}"
                            th:value="${serie.id}"
                            th:text="${serie.nombre}"
                            th:selected="${publicacion.serie != null and publicacion.serie.id == serie.id}">Colección</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label for="orden">Nº Orden en Colección:</label>
                <input type="number" id="orden" name="orden" min="1" placeholder="Ej. 1" th:value="${publicacion.orden}" style="width: 100%; padding: 8px;">
            </div>
        </div>

        <div>
            <label for="descripcion">Descripción breve:</label>
            <textarea id="descripcion" name="descripcion" rows="3" th:text="${publicacion.descripcion}"></textarea>
        </div>

        <div>
            <label for="editor">Texto de la publicación:</label>
            <textarea id="editor" name="texto" th:text="${publicacion.texto}"></textarea>
        </div>

        <button type="submit">Guardar cambios</button>
    </form>
</div>

<div th:insert="fragments/footer :: footer"></div>

<style>
    .tox-tinymce {
        border-radius: 6px;
        border: 1px solid #ddd !important;
        margin-top: 8px;
    }

    .tox-editor-header {
        background-color: #f9f9f9 !important;
    }

    .tox-toolbar__primary {
        background-color: #f9f9f9 !important;
        border-bottom: 1px solid #ddd !important;
    }

    .tox-toolbar-overlord {
        background-color: #f9f9f9 !important;
    }

    #editor {
        display: none;
    }
</style>

<script>
tinymce.init({
  selector: '#editor',
  plugins: 'lists link image table code help wordcount',
  toolbar: 'undo redo | formatselect | bold italic underline strikethrough | alignleft aligncenter alignright | bullist numlist outdent indent | link image table | code help',
  height: 500,
  menubar: 'file edit view insert format tools table help',
  content_style: "body { font-family: Arial, sans-serif; font-size: 14px; line-height: 1.6; }",
  automatic_uploads: false,
  language: 'es',
  branding: false,
  promotion: false
});

document.querySelector('form').addEventListener('submit', function(e) {
  const content = tinymce.get('editor').getContent();
  
  if (!content || content.trim() === '' || content === '<p></p>' || content === '<p><br></p>') {
    e.preventDefault();
    alert('Por favor, escribe contenido en el editor antes de guardar.');
    return false;
  }
});
</script>

</body>
</html>
